version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Amplify's build image has no Flutter SDK, so install a pinned version.
        - git clone https://github.com/flutter/flutter.git -b 3.44.8 --depth 1 $HOME/flutter
        - export PATH="$PATH:$HOME/flutter/bin"
        - flutter config --no-analytics
        - flutter doctor
        - flutter pub get
    build:
      commands:
        - export PATH="$PATH:$HOME/flutter/bin"
        - flutter build web --release
  artifacts:
    # The compiled web app Amplify will host.
    baseDirectory: build/web
    files:
      - '**/*'
  cache:
    paths:
      # Cache the SDK and pub packages so later builds are much faster.
      - $HOME/flutter/**/*
      - .dart_tool/**/*
